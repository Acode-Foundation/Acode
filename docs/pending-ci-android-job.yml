# PENDING: replace .github/workflows/ci.yml with this file's content.
#
# Why this isn't already in .github/workflows/: the GitHub connector used to
# make these commits doesn't have the `workflows` permission scope (a
# separate, opt-in GitHub App permission for modifying Actions config beyond
# normal repo contents). Writing here succeeds; writing to .github/workflows/
# is rejected with 403. To apply: grant that permission and re-run, or just
# copy this file's content over .github/workflows/ci.yml yourself and delete
# this file.
#
# What changed vs the current ci.yml:
#   1. FIX: unit-tests and translation-check ran `npm ci` and cached
#      `**/package-lock.json` — but package-lock.json was deleted in the
#      Phase 0.1 cleanup (bun.lock is canonical). Both jobs have been
#      broken/misconfigured since that cleanup landed. Switched to
#      oven-sh/setup-bun + `bun install --frozen-lockfile`.
#   2. NEW: android-build job (PR only) — JDK 17 + Gradle cache, runs
#      `./gradlew assembleDebug` in android/. Gated on android/ existing
#      (via a step-level check), so it no-ops rather than fails until the
#      native Capacitor scaffold (Phase 0.2's other open item) is generated
#      and committed.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  merge_group:

jobs:
  spell-check:
    timeout-minutes: 5
    name: Check spelling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check spelling
        uses: crate-ci/typos@main
        with:
          config: ./_typos.toml

  quality:
    timeout-minutes: 5
    name: Linting and formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7.1

      - name: Run Biome
        run: biome ci .

  unit-tests:
    name: Unit Tests (On PR Only)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun run test

  translation-check:
    name: Translation Check (On PR Only)
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      pull-requests: read
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Detect Changed Files
        uses: dorny/paths-filter@v4
        id: file-changes
        with:
          list-files: shell
          filters: |
            translation:
              - 'src/lang/*.json'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Translation Files Check (if changed)
        if: steps.file-changes.outputs.translation == 'true'
        run: |
            bun install --frozen-lockfile
            bun run lang check

  android-build:
    name: Android Build (On PR Only)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for Android platform
        id: android-check
        run: echo "exists=$([ -d android ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        if: steps.android-check.outputs.exists == 'true'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build debug APK
        if: steps.android-check.outputs.exists == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
