name: CI

on:
  push:
  pull_request:
  merge_group:

jobs:
  spell-check:
    timeout-minutes: 5
    name: Check spelling
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Actions Repository
        uses: actions/checkout@v7

      - name: Check spelling
        uses: crate-ci/typos@master
        with:
          config: ./_typos.toml

  quality:
    timeout-minutes: 5
    name: Linting and formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Biome
        uses: biomejs/setup-biome@v2

      - name: Run Biome
        run: biome ci .

  unit-tests:
    timeout-minutes: 15
    name: Unit and dependency checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            src/plugins/admob/package-lock.json
            src/plugins/cordova-plugin-advanced-http/package-lock.json

      - name: Use Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run JavaScript tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Verify generated AdMob bundle
        run: |
          npm run build:admob
          npm run check:admob-bundle
          git diff --exit-code -- src/plugins/admob/www/admob.js

      - name: Verify Bun lockfile
        run: bun install --frozen-lockfile --dry-run

      - name: Reject critical dependency advisories
        run: |
          npm audit --package-lock-only --audit-level=critical
          npm audit --prefix src/plugins/admob --package-lock-only --audit-level=critical
          npm audit --prefix src/plugins/cordova-plugin-advanced-http --package-lock-only --audit-level=critical

  translation-check:
    name: Translation Check (On PR Only)
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      pull-requests: read
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Detect Changed Files
        uses: dorny/paths-filter@v4
        id: file-changes
        with:
          list-files: shell
          filters: |
            translation:
              - 'src/lang/*.json'
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Translation Files Check (if changed)
        if: steps.file-changes.outputs.translation == 'true'
        run: |
            npm ci --no-audit --no-fund
            npm run lang check
