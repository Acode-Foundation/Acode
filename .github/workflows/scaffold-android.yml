name: Scaffold Android platform (Phase 0.2)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  scaffold-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Refuse to clobber an existing android/
        run: |
          if [ -d android ]; then
            echo "android/ already exists — nothing to scaffold. Remove it (or this workflow) first."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Add Capacitor deps
        run: |
          bun add @capacitor/core
          bun add -D @capacitor/cli @capacitor/android

      - name: Generate Android platform
        run: npx cap add android

      - name: Apply ADR-008 minSdkVersion override
        run: sed -i -E 's/minSdkVersion = [0-9]+/minSdkVersion = 29/' android/variables.gradle

      - name: Apply ADR-011 deep-link intent-filter
        run: |
          cat > /tmp/patch-manifest.js <<'EOF'
          const fs = require('fs');
          const p = 'android/app/src/main/AndroidManifest.xml';
          let xml = fs.readFileSync(p, 'utf8');
          if (!xml.includes('android:scheme="bract"')) {
            const filter = `            <intent-filter android:autoVerify="false">
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="bract" />
            </intent-filter>

        </activity>`;
            xml = xml.replace('        </activity>', filter);
            fs.writeFileSync(p, xml);
          }
          EOF
          node /tmp/patch-manifest.js

      - name: Commit and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B phase-0.2-android-scaffold
          git add -A
          git commit -m "Phase 0.2: generate Android platform (cap add android) + ADR-008/ADR-011 overrides"
          git push -f -u origin phase-0.2-android-scaffold
          gh pr create --title "Phase 0.2: native Android scaffold" \
            --body "Generated via workflow_dispatch: npx cap add android, then minSdkVersion to 29 (ADR-008) and the bract:// deep-link intent-filter (ADR-011) applied on top. Review the diff, then merge." \
            --base main --head phase-0.2-android-scaffold \
            || echo "PR create failed or already exists — check the Pull Requests tab."
